<meta charset="UTF-8">

<title>Ticket hôm nay — Sprint 10tr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C2027;
    --panel:#252A33;
    --panel2:#2C323C;
    --border:#3A4049;
    --text:#E7E9EC;
    --muted:#8B93A1;
    --amber:#E8993E;
    --green:#3FBF7F;
    --red:#E2584A;
    --blue:#5B9FE8;
    --violet:#B98CE8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  /* Header / ticket bar */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .dot{
    width:10px;height:10px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 4px rgba(232,153,62,0.18);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;} 50%{opacity:.4;}
  }
  .brand-text .t1{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  .brand-text .t2{font-size:15px;font-weight:600;}
  .ticket-id{
    font-size:11px;color:var(--muted);text-align:right;line-height:1.5;
  }
  .ticket-id b{color:var(--amber);}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--panel);
    padding:4px;border-radius:10px;border:1px solid var(--border);}
  .tab{
    flex:1;text-align:center;padding:9px 6px;border-radius:7px;
    font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;
    transition:.15s;
  }
  .tab.active{background:var(--panel2);color:var(--text);}

  /* Progress strip */
  .progress-wrap{margin-bottom:22px;}
  .progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .progress-bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#F2B968);border-radius:99px;transition:width .4s;}

  /* Section card */
  .card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:18px;margin-bottom:16px;
  }
  .phase-tag{
    display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;
    padding:3px 9px;border-radius:99px;background:rgba(232,153,62,.15);
    color:var(--amber);margin-bottom:10px;
  }
  .day-title{font-size:19px;font-weight:600;margin:0 0 4px;}
  .day-sub{font-size:13px;color:var(--muted);margin:0 0 16px;}

  /* Task list */
  .task{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 0;border-top:1px solid var(--border);
  }
  .task:first-of-type{border-top:none;}
  .task.done .task-text{color:var(--muted);text-decoration:line-through;}
  .checkbox{
    flex:none;width:20px;height:20px;border-radius:6px;
    border:1.5px solid var(--border);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;transition:.15s;
  }
  .checkbox.checked{background:var(--green);border-color:var(--green);}
  .checkbox svg{width:12px;height:12px;display:none;}
  .checkbox.checked svg{display:block;}
  .task-body{flex:1;}
  .task-tag{
    display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;
    padding:2px 7px;border-radius:5px;margin-bottom:5px;
  }
  .tag-tiktok{background:rgba(91,159,232,.15);color:var(--blue);}
  .tag-ai{background:rgba(63,191,127,.15);color:var(--green);}
  .tag-dichvu{background:rgba(232,153,62,.15);color:var(--amber);}
  .tag-congviec{background:rgba(226,88,74,.15);color:var(--red);}
  .tag-suckhoe{background:rgba(139,147,161,.2);color:var(--muted);}
  .tag-hocai{background:rgba(185,140,232,.16);color:var(--violet);}
  .week-topic{
    display:flex;gap:8px;align-items:center;background:rgba(185,140,232,.1);
    border:1px solid rgba(185,140,232,.3);border-radius:10px;padding:9px 12px;
    font-size:12.5px;margin-bottom:14px;color:#D3B6F2;
  }
  .week-topic b{color:#fff;}
  .task-text{font-size:14px;line-height:1.5;}

  .empty-note{font-size:13px;color:var(--muted);line-height:1.6;}

  /* Streak footer */
  .stats-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:12px;text-align:center;
  }
  .stat .n{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

  /* Roadmap tab */
  .phase-block{margin-bottom:14px;}
  .phase-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .phase-head h3{font-size:14px;margin:0;}
  .phase-head span{font-size:11px;color:var(--muted);}
  .week-grid{display:flex;gap:6px;}
  .week-cell{
    flex:1;height:34px;border-radius:8px;background:var(--panel2);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
    position:relative;
  }
  .week-cell.current{border-color:var(--amber);color:var(--amber);font-weight:700;}
  .week-cell.past{background:rgba(63,191,127,.12);color:var(--green);}
  .goal-card{
    background:linear-gradient(135deg, rgba(232,153,62,.12), rgba(232,153,62,.03));
    border:1px solid rgba(232,153,62,.35);
  }
  .goal-card .n{font-size:28px;font-weight:700;color:var(--amber);font-family:'IBM Plex Mono',monospace;}

  .settings-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:14px;}
  .settings-row input{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  }
  .settings-row button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;
  }
  .settings-row button:hover{border-color:var(--amber);color:var(--amber);}
</style>
</head>

 ]},
 12:{topic:"Tổng kết & chọn bộ công cụ AI lõi để dùng lâu dài", days:[
   "Liệt kê tất cả công cụ AI đã học qua 12 tuần, đánh giá cái nào thực sự hữu ích",
   "Chọn ra 3 công cụ AI cốt lõi sẽ dùng thường xuyên sau sprint này",
   "Viết lại quy trình làm nội dung + dịch vụ chuẩn hoá dùng 3 công cụ đó",
   "Chia sẻ 1 video \"hành trình 12 tuần dùng AI\" — vừa làm nội dung vừa tổng kết cho follow xem",
   "Lên kế hoạch AI learning track tiếp theo cho 12 tuần kế (nếu cần)"
 ]}
};

let state = {
  startDate: null,
  activeTab: "today",
  checks: {}, // dateStr -> [bool,...]
  loaded:false
};

function fmtDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayStr(){ return fmtDate(new Date()); }

async function loadState(){
  try{
    state.startDate = localStorage.getItem("sprint_start_date");
  }catch(e){ state.startDate = null; }
  if(!state.startDate){
    state.startDate = todayStr();
    try{ localStorage.setItem("sprint_start_date", state.startDate); }catch(e){}
  }
  state.loaded = true;
}

async function getChecks(dateStr){
  try{
    const v = localStorage.getItem("checks_"+dateStr);
    return v ? JSON.parse(v) : [];
  }catch(e){ return []; }
}
async function setChecks(dateStr, arr){
  try{ localStorage.setItem("checks_"+dateStr, JSON.stringify(arr)); }catch(e){}
}

function dayInfo(dateStr){
  const start = new Date(state.startDate+"T00:00:00");
  const d = new Date(dateStr+"T00:00:00");
  const diffDays = Math.floor((d-start)/86400000);
  const weekNum = Math.min(12, Math.max(1, Math.floor(diffDays/7)+1));
  const dow = d.getDay(); // 0 sun .. 6 sat
  const dayIndex = dow===0 ? 6 : dow-1; // 0=Mon..6=Sun
  const phase = PHASES.find(p=>p.weeks.includes(weekNum)) || PHASES[3];
  const weekInPhase = phase.weeks.indexOf(weekNum)+1;
  const dayOfWeekOverall = diffDays+1;
  return {weekNum, dayIndex, phase, weekInPhase, diffDays, dayOfWeekOverall};
}

function getTasksForDate(dateStr){
  const info = dayInfo(dateStr);
  const base = (TASKS[info.phase.key][info.dayIndex]||[]).slice();
  const learning = AI_LEARNING[info.weekNum];
  if(learning){
    if(info.dayIndex<=4){
      base.push({tag:"hocai", text: learning.days[info.dayIndex]});
    }else if(info.dayIndex===5){
      base.push({tag:"hocai", text: "Ôn lại nhanh chủ đề tuần này: "+learning.topic});
    }
  }
  return base;
}

async function computeStreak(){
  // count consecutive past days (including today if fully done) where all tasks were checked
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<60;i++){
    const ds = fmtDate(cursor);
    const tasks = getTasksForDate(ds);
    const checks = await getChecks(ds);
    const allDone = tasks.length>0 && tasks.every((_,idx)=>checks[idx]);
    if(allDone){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function tagClass(tag){ return "task-tag tag-"+tag; }

async function renderToday(container){
  const ds = todayStr();
  const info = dayInfo(ds);
  const tasks = getTasksForDate(ds);
  const learning = AI_LEARNING[info.weekNum];
  const checks = await getChecks(ds);
  const doneCount = tasks.filter((_,i)=>checks[i]).length;
  const streak = await computeStreak();
  const pct = Math.round((info.weekNum/12)*100);

  const dateObj = new Date();
  const dateLabel = dateObj.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});

  container.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="n">${info.weekNum}/12</div><div class="l">Tuần sprint</div></div>
      <div class="stat"><div class="n">${streak}</div><div class="l">Streak (ngày)</div></div>
      <div class="stat"><div class="n">${doneCount}/${tasks.length}</div><div class="l">Hôm nay</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-labels"><span>Tiến độ sprint 10tr đầu tiên</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <div class="phase-tag">PHASE ${info.phase.key} · ${info.phase.name} · TUẦN ${info.weekInPhase}/3</div>
      <div class="day-title">${DAYNAMES[info.dayIndex]} — ${dateLabel}</div>
      <div class="day-sub">${DAYSUB[info.dayIndex]}</div>
      ${learning ? `<div class="week-topic">🎯 Học AI tuần này: <b>${learning.topic}</b></div>` : ""}
      <div id="task-list"></div>
    </div>
  `;

  const list = container.querySelector("#task-list");
  if(tasks.length===0){
    list.innerHTML = `<div class="empty-note">Không có việc nào hôm nay — nghỉ ngơi đúng nghĩa.</div>`;
  }else{
    tasks.forEach((t,idx)=>{
      const isChecked = !!checks[idx];
      const row = document.createElement("div");
      row.className = "task"+(isChecked?" done":"");
      row.innerHTML = `
        <div class="checkbox${isChecked?" checked":""}" data-idx="${idx}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#12161C" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
        </div>
        <div class="task-body">
          <span class="${tagClass(t.tag)}">${TAG_LABEL[t.tag]}</span>
          <div class="task-text">${t.text}</div>
        </div>
      `;
      const cb = row.querySelector(".checkbox");
      cb.addEventListener("click", async ()=>{
        const cur = await getChecks(ds);
        cur[idx] = !cur[idx];
        await setChecks(ds, cur);
        render();
      });
      list.appendChild(row);
    });
  }
}

function renderRoadmap(container){
  const ds = todayStr();
  const info = dayInfo(ds);
  container.innerHTML = `
    <div class="card goal-card">
      <div class="phase-tag">MỤC TIÊU DUY NHẤT</div>
      <div class="n">10.000.000 ₫ / tháng</div>
      <div class="empty-note">Dòng tiền thụ động đầu tiên, từ kênh TikTok cũ đổi nội dung sang chủ đề "dùng công cụ AI" — không phải 30tr, để sau.</div>
    </div>
    <div class="card">
      <div class="day-title" style="font-size:16px;margin-bottom:14px;">Lộ trình 12 tuần</div>
      ${PHASES.map(p=>{
        const cells = p.weeks.map(w=>{
          let cls = "week-cell";
          if(w < info.weekNum) cls += " past";
          if(w === info.weekNum) cls += " current";
          return `<div class="${cls}">T${w}</div>`;
        }).join("");
        return `
          <div class="phase-block">
            <div class="phase-head"><h3>PHASE ${p.key} · ${p.name}</h3><span>${p.weeks.length} tuần</span></div>
            <div class="week-grid">${cells}</div>
          </div>
        `;
      }).join("")}
    </div>
    <div class="card">
      <div class="day-title" style="font-size:16px;margin-bottom:10px;">Lộ trình học AI — 1 chủ đề / tuần</div>
      ${Object.keys(AI_LEARNING).map(w=>{
        const wnum = parseInt(w);
        const l = AI_LEARNING[w];
        let cls = "task-tag tag-hocai";
        let doneStyle = wnum < info.weekNum ? "opacity:.5;" : (wnum===info.weekNum ? "font-weight:600;" : "");
        return `<div style="padding:8px 0;border-top:1px solid var(--border);font-size:13px;${doneStyle}">
          <span class="${cls}" style="margin-right:8px;">T${wnum}</span>${l.topic}
        </div>`;
      }).join("")}
    </div>
    <div class="card">
      <div class="day-title" style="font-size:16px;margin-bottom:8px;">Ngày bắt đầu sprint</div>
      <div class="empty-note">Mặc định là ngày đầu tiên mày mở app này. Nếu muốn đổi lại ngày bắt đầu:</div>
      <div class="settings-row">
        <input type="date" id="start-input" value="${state.startDate}">
        <button id="save-start">Lưu</button>
      </div>
    </div>
  `;
  const btn = container.querySelector("#save-start");
  btn.addEventListener("click", async ()=>{
    const val = container.querySelector("#start-input").value;
    if(val){
      state.startDate = val;
      try{ localStorage.setItem("sprint_start_date", val); }catch(e){}
      render();
    }
  });
}

async function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div class="brand-text">
          <div class="t1">Đang xử lý</div>
          <div class="t2">Ticket hôm nay</div>
        </div>
      </div>
      <div class="ticket-id">TICKET #<b id="ticket-num">--</b><br>SPRINT 10TR</div>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="today">Hôm nay</div>
      <div class="tab" data-tab="roadmap">Lộ trình 12 tuần</div>
    </div>
    <div id="content"></div>
  `;
  app.querySelectorAll(".tab").forEach(t=>{
    if(t.dataset.tab===state.activeTab) t.classList.add("active");
    t.addEventListener("click", ()=>{ state.activeTab=t.dataset.tab; render(); });
  });

  const info = dayInfo(todayStr());
  document.getElementById("ticket-num").textContent = `W${String(info.weekNum).padStart(2,"0")}-D${String(info.dayOfWeekOverall).padStart(3,"0")}`;

  const content = document.getElementById("content");
  if(state.activeTab==="today"){
    await renderToday(content);
  }else{
    renderRoadmap(content);
  }
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
